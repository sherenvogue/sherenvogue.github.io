<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary SEO -->
    <title>SherenVogue — Premium Ladies Bags, Watches, Belts & Wallets</title>
    <meta name="description" content="SherenVogue offers premium fashion accessories — ladies bags, luxury watches for men and women, stylish belts and wallets. Shop 40+ curated products with fast delivery." />
    <meta name="keywords" content="ladies bags, women bags, men watches, women watches, luxury belts, leather wallets, fashion accessories, SherenVogue" />
    <meta name="author" content="SherenVogue" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://sherenvogue.replit.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sherenvogue.replit.app/" />
    <meta property="og:title" content="SherenVogue — Premium Fashion Accessories" />
    <meta property="og:description" content="Discover curated ladies bags, luxury watches, stylish belts and wallets at SherenVogue. Premium quality, modern style." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=1200&q=80" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="SherenVogue" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SherenVogue — Premium Fashion Accessories" />
    <meta name="twitter:description" content="Shop ladies bags, luxury watches, belts and wallets at SherenVogue." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=1200&q=80" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "SherenVogue",
      "description": "Premium fashion accessories — ladies bags, luxury watches, stylish belts and wallets",
      "url": "https://sherenvogue.replit.app",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://sherenvogue.replit.app/shop?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
