<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SherenVogue | Exquisite Luxury</title>
    <!-- Google Fonts for Luxury Look -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-gold: #c7a17a;
            --bg-dark: #070707;
            --surface-dark: #121212;
            --text-light: #f4f4f4;
            --text-muted: #999999;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Animations Setup --- */
        @keyframes fadeDownLogo {
            0% { opacity: 0; transform: translateY(-30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUpText {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes revealMedia {
            0% { opacity: 0; transform: scale(1.05); filter: brightness(0.4); }
            100% { opacity: 1; transform: scale(1); filter: brightness(0.9); }
        }

        /* Navbar / Header */
        header {
            width: 100%;
            padding: 30px 50px;
            display: flex;
            justify-content: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 50px;
            animation: fadeDownLogo 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .brand-logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--primary-gold);
            text-decoration: none;
        }

        /* Product Container */
        .product-container {
            max-width: 1100px;
            width: 90%;
            background-color: var(--surface-dark);
            border: 1px solid rgba(199, 161, 122, 0.1);
            padding: 50px;
            display: flex;
            gap: 60px;
            margin-bottom: 80px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        /* Media Section (Image / Video) */
        .media-section {
            flex: 1.2;
            position: relative;
            overflow: hidden; /* keeps the zoom animation inside the box */
            border-radius: 4px;
        }

        .media-section img, .media-section video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            aspect-ratio: 3/4;
            filter: brightness(0.9);
            transition: filter 0.5s ease;
            display: none; 
            animation: revealMedia 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .media-section:hover img, .media-section:hover video {
            filter: brightness(1);
        }

        /* Details Section */
        .details-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Applying staggered animations to texts */
        .details-section > * {
            opacity: 0; /* hidden before animation */
            animation: fadeUpText 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .category-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--primary-gold);
            margin-bottom: 15px;
            font-weight: 500;
            animation-delay: 0.3s;
        }

        .product-title {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 400;
            line-height: 1.2;
            margin-bottom: 20px;
            color: var(--text-light);
            animation-delay: 0.5s;
        }

        .product-price {
            font-size: 1.8rem;
            font-weight: 300;
            color: var(--text-light);
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 30px;
            animation-delay: 0.7s;
        }

        .product-description {
            font-size: 0.95rem;
            line-height: 1.9;
            color: var(--text-muted);
            margin-bottom: 40px;
            font-weight: 300;
            animation-delay: 0.9s;
        }

        /* Luxury Button */
        .btn-order {
            background-color: transparent;
            color: var(--primary-gold);
            border: 1px solid var(--primary-gold);
            padding: 18px 40px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.4s ease;
            font-family: 'Montserrat', sans-serif;
            width: 100%;
            animation-delay: 1.1s;
        }

        .btn-order:hover {
            background-color: var(--primary-gold);
            color: var(--bg-dark);
            box-shadow: 0 0 20px rgba(199, 161, 122, 0.3);
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .product-container {
                flex-direction: column;
                padding: 30px;
                gap: 30px;
            }
            .product-title {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <a href="#" class="brand-logo">SherenVogue</a>
    </header>

    <!-- Product Section -->
    <div class="product-container">
        <div class="media-section">
            <img id="p-img" src="" alt="SherenVogue Exquisite Piece">
            <!-- Video Tag -->
            <video id="p-video" controls autoplay muted loop playsinline></video>
        </div>
        
        <div class="details-section">
            <span id="p-cat" class="category-tag">Loading...</span>
            <h1 id="p-name">Loading...</h1>
            <div id="p-price" class="product-price">৳0</div>
            <p id="p-desc" class="product-description">Discovering the essence of true craftsmanship...</p>
            
            <button class="btn-order">Add to Collection</button>
        </div>
    </div>

    <script>
        // প্রোডাক্ট ডেটা
        const productsData = [
            {
                id: "sv-01",
                name: "The Signature Woven Collection",
                price: "12,500",
                video: "https://www.w3schools.com/html/mov_bbb.mp4", // এখানে আপনার অরিজিনাল ভিডিওর লিংক বসাবেন
                image: "https://images.unsplash.com/photo-1590736969955-71cc94801759?q=80&w=600&auto=format&fit=crop",
                category: "Ladies Handbags",
                description: "Experience the epitome of elegance. This meticulously crafted woven piece brings an unparalleled level of sophistication to your daily ensemble, blending timeless tradition with modern luxury aesthetics."
            }
        ];

        const product = productsData[0];
        const imgEl = document.getElementById('p-img');
        const videoEl = document.getElementById('p-video');

        // ভিডিও বা ইমেজ সেট করা
        if(product.video) {
            videoEl.src = product.video;
            videoEl.style.display = 'block';
            imgEl.style.display = 'none';
        } else if(product.image) {
            imgEl.src = product.image;
            imgEl.style.display = 'block';
            videoEl.style.display = 'none';
        }

        // টেক্সট ডেটা সেট করা
        document.getElementById('p-name').innerText = product.name;
        document.getElementById('p-price').innerText = `৳${product.price}`;
        document.getElementById('p-cat').innerText = product.category;
        document.getElementById('p-desc').innerText = product.description;
        document.title = `${product.name} | SherenVogue`;
    </script>

</body>
</html>
