<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHERENVOGUE | Haute Couture</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ---------------------------------------------------
           Pure CSS Background Animation (No Video File Needed)
           --------------------------------------------------- */
        body, html {
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            background: linear-gradient(-45deg, #050505, #1a1a1a, #2a1f10, #000000);
            background-size: 400% 400%;
            animation: luxuryGradientBG 12s ease infinite;
        }

        /* ব্যাকগ্রাউন্ড অ্যানিমেশন ফ্রেম */
        @keyframes luxuryGradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* মেইন কন্টেন্ট এলাইনমেন্ট */
        .content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            color: #fff;
            z-index: 1;
            position: relative;
            animation: fadeIn 2s ease-in-out;
        }

        /* SherenVogue ব্র্যান্ড টাইপোগ্রাফি */
        h1.brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 4.5rem;
            letter-spacing: 0.15em;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            font-weight: 400;
            text-shadow: 2px 4px 15px rgba(0,0,0,0.8);
        }

        h1.brand-name span {
            font-style: italic;
            color: #D4AF37; /* লাক্সারি গোল্ডেন কালার */
        }

        h2.subtitle {
            font-size: 0.95rem;
            letter-spacing: 0.5em;
            color: #C0C0C0;
            margin-bottom: 4rem;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* লাক্সারি বাটন */
        .shop-btn {
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.25em;
            color: #111;
            background: linear-gradient(60deg, #C5A059, #F3E5AB, #C5A059, #D4AF37);
            background-size: 300% 300%;
            padding: 16px 45px;
            border: 1px solid #F3E5AB;
            border-radius: 2px;
            transition: all 0.4s ease;
            text-transform: uppercase;
            font-weight: 600;
            animation: goldShimmer 3.5s ease infinite;
            cursor: pointer;
        }

        .shop-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 35px rgba(212, 175, 55, 0.4);
            border-color: #FFF;
            color: #000;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes goldShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* মোবাইল রেসপন্সিভ */
        @media (max-width: 768px) {
            h1.brand-name {
                font-size: 2.8rem;
                letter-spacing: 0.1em;
            }
            h2.subtitle {
                font-size: 0.75rem;
                letter-spacing: 0.3em;
                margin-bottom: 3.5rem;
            }
            .shop-btn {
                padding: 15px 35px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="content">
        <h1 class="brand-name">SHEREN<span>VOGUE</span></h1>
        <h2 class="subtitle">Haute Couture</h2>
        <a href="shop.html" class="shop-btn">Enter Store</a>
    </div>

</body>
</html>
