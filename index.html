<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Opora's Shop - Fast & Secure E-Commerce</title>
    <meta name="description" content="Buy the best products online with fast delivery and easy order cancellation.">
    <meta name="keywords" content="online shop, e-commerce, buy products, fast delivery, opora shop">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Opora">
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="Opora's Shop - Fast & Secure E-Commerce">
    <meta property="og:description" content="Buy the best products online with easy order tracking.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // !!! এখানে আপনার EmailJS Public Key বসাবেন !!!
            emailjs.init("YOUR_EMAILJS_PUBLIC_KEY"); 
        })();
    </script>
</head>
<body class="bg-gray-100 font-sans">

    <header class="bg-blue-600 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold tracking-wide">Opora's Shop</h1>
            
            <div class="relative w-full md:w-1/2">
                <input type="text" id="searchBar" placeholder="প্রোডাক্ট খুঁজুন (যেমন: Phone, Laptop...)" class="w-full p-2 pl-4 rounded-lg text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>
            
            <div class="flex gap-4">
                <button onclick="scrollToSection('cart-section')" class="bg-blue-700 px-4 py-2 rounded-lg hover:bg-blue-800 transition">
                    কার্ট (<span id="cartCount">0</span>)
                </button>
                <button onclick="scrollToSection('order-section')" class="bg-green-600 px-4 py-2 rounded-lg hover:bg-green-700 transition">
                    অর্ডার ট্র্যাক (<span id="orderCount">0</span>)
                </button>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <section class="lg:col-span-2">
            <h2 class="text-xl font-bold mb-4 text-gray-700">আমাদের প্রোডাক্টসমূহ</h2>
            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                </div>
        </section>

        <aside class="space-y-6">
            
            <div id="cart-section" class="bg-white p-4 rounded-xl shadow-md border border-gray-200">
                <h2 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">শপিং কার্ট</h2>
                <div id="cartItems" class="space-y-3 max-h-60 overflow-y-auto mb-4">
                    <p class="text-gray-500 text-center">কার্ট খালি আছে</p>
                </div>
                <div class="flex justify-between font-bold text-lg mb-4 border-t pt-2">
                    <span>মোট দাম:</span>
                    <span>৳<span id="cartTotal">0</span></span>
                </div>
                <button id="checkoutBtn" onclick="confirmOrder()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    অর্ডার কনফার্ম করুন
                </button>
            </div>

            <div id="order-section" class="bg-white p-4 rounded-xl shadow-md border border-gray-200">
                <h2 class="text-xl font-bold mb-4 text-green-600 border-b pb-2">আপনার কনফার্মড অর্ডার</h2>
                <div id="orderStatusList" class="space-y-4">
                    <p class="text-gray-500 text-center">এখনো কোনো অর্ডার করা হয়নি</p>
                </div>
            </div>

        </aside>
    </main>

    <script>
        // ডামি প্রোডাক্ট ডাটা (এখানে আপনি আপনার প্রোডাক্ট যোগ করতে পারেন)
        const products = [
            { id: 1, name: "Smart Phone Pro", price: 25000, category: "phone", img: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=300" },
            { id: 2, name: "Wireless Headphones", price: 3500, category: "audio", img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300" },
            { id: 3, name: "Sleek Laptop Core i5", price: 55000, category: "laptop", img: "https://images.unsplash.com/photo-1496181130204-755241524eab?w=300" },
            { id: 4, name: "Smart Watch Series 7", price: 4500, category: "watch", img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300" }
        ];

        let cart = [];
        let orders = [];

        // ১. প্রোডাক্ট রেন্ডার এবং সার্চ বার ফাংশন (Search Bar Working)
        function displayProducts(productsToRender) {
            const productGrid = document.getElementById('productGrid');
            productGrid.innerHTML = "";
            
            if(productsToRender.length === 0) {
                productGrid.innerHTML = `<p class="text-gray-500 col-span-2 text-center py-8">কোনো প্রোডাক্ট পাওয়া যায়নি!</p>`;
                return;
            }

            productsToRender.forEach(product => {
                productGrid.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow hover:shadow-lg transition flex flex-col justify-between border">
                        <img src="${product.img}" alt="${product.name}" class="w-full h-40 object-cover rounded-lg mb-3">
                        <div>
                            <h3 class="font-bold text-lg text-gray-800">${product.name}</h3>
                            <p class="text-blue-600 font-semibold mt-1">৳${product.price}</p>
                        </div>
                        <button onclick="addToCart(${product.id})" class="mt-3 w-full bg-blue-500 hover:bg-blue-600 text-white py-2 rounded-md transition text-sm font-medium">
                            কার্টে যোগ করুন
                        </button>
                    </div>
                `;
            });
        }

        // রিয়েল-টাইম সার্চ ইনপুট লিসেনার
        document.getElementById('searchBar').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredProducts = products.filter(product => 
                product.name.toLowerCase().includes(searchTerm)
            );
            displayProducts(filteredProducts);
        });

        // ২. কার্ট ফাংশনালিটি (Add, Remove, Update)
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const cartItem = cart.find(item => item.id === id);

            if (cartItem) {
                cartItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cartItems');
            const cartCount = document.getElementById('cartCount');
            const cartTotal = document.getElementById('cartTotal');
            const checkoutBtn = document.getElementById('checkoutBtn');

            cartItemsContainer.innerHTML = "";
            let total = 0;
            let count = 0;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `<p class="text-gray-500 text-center">কার্ট খালি আছে</p>`;
                checkoutBtn.disabled = true;
            } else {
                checkoutBtn.disabled = false;
                cart.forEach(item => {
                    total += item.price * item.quantity;
                    count += item.quantity;
                    cartItemsContainer.innerHTML += `
                        <div class="flex justify-between items-center bg-gray-50 p-2 rounded-lg border text-sm">
                            <div class="flex-1">
                                <h4 class="font-semibold text-gray-800">${item.name}</h4>
                                <p class="text-gray-600">৳${item.price} x ${item.quantity}</p>
                            </div>
                            <button onclick="removeFromCart(${item.id})" class="text-red-500 hover:text-red-700 ml-2 font-bold">✕</button>
                        </div>
                    `;
                });
            }

            cartCount.innerText = count;
            cartTotal.innerText = total;
        }

        // ৩. অর্ডার কনফার্মেশন (User Order View & Email Alert)
        function confirmOrder() {
            if (cart.length === 0) return;

            const orderId = '#ORD' + Math.floor(100000 + Math.random() * 900000);
            const currentOrder = {
                id: orderId,
                items: [...cart],
                total: document.getElementById('cartTotal').innerText,
                date: new Date().toLocaleString('bn-BD')
            };

            orders.push(currentOrder);
            
            // মেইল ডাটা তৈরি (আপনার মেইলে যাবে)
            let productDetails = cart.map(item => `${item.name} (${item.quantity}টি) - ৳${item.price * item.quantity}`).join(', ');
            
            sendEmailNotification(
                "নতুন অর্ডার এসেছে! 🎉", 
                `অর্ডার আইডি: ${orderId}\nপ্রোডাক্টসমূহ: ${productDetails}\nসর্বমোট মূল্য: ৳${currentOrder.total}\nসময়: ${currentOrder.date}`
            );

            // কার্ট খালি করা
            cart = [];
            updateCartUI();
            updateOrderUI();
            
            alert(`আপনার অর্ডার সফলভাবে কনফার্ম হয়েছে! অর্ডার আইডি: ${orderId}`);
        }

        // ৪. অর্ডার ক্যানসেল অপশন (Cancel Option & Email Alert)
        function cancelOrder(orderId) {
            const orderToCancel = orders.find(o => o.id === orderId);
            if (!orderToCancel) return;

            if (confirm("আপনি কি নিশ্চিত যে এই অর্ডারটি বাতিল করতে চান?")) {
                orders = orders.filter(o => o.id !== orderId);
                
                // ক্যানসেল মেইল নোটিফিকেশন
                sendEmailNotification(
                    "অর্ডার বাতিল করা হয়েছে! ❌", 
                    `অর্ডার আইডি: ${orderId} ক্যানসেল করা হয়েছে।\nমোট মূল্য ছিল: ৳${orderToCancel.total}`
                );

                updateOrderUI();
                alert(`অর্ডার ${orderId} বাতিল করা হয়েছে।`);
            }
        }

        // অর্ডার লিস্ট আপডেট UI
        function updateOrderUI() {
            const orderStatusList = document.getElementById('orderStatusList');
            document.getElementById('orderCount').innerText = orders.length;

            if (orders.length === 0) {
                orderStatusList.innerHTML = `<p class="text-gray-500 text-center">এখনো কোনো সক্রিয় অর্ডার নেই</p>`;
                return;
            }

            orderStatusList.innerHTML = "";
            orders.forEach(order => {
                let itemsHtml = order.items.map(item => `<li>• ${item.name} (${item.quantity}টি)</li>`).join('');
                
                orderStatusList.innerHTML += `
                    <div class="bg-green-50 p-3 rounded-lg border border-green-200 text-sm space-y-2">
                        <div class="flex justify-between font-bold text-gray-800">
                            <span>আইডি: ${order.id}</span>
                            <span class="text-green-600">কনফার্মড</span>
                        </div>
                        <ul class="text-gray-700 text-xs space-y-1">
                            ${itemsHtml}
                        </ul>
                        <div class="flex justify-between items-center pt-2 border-t border-green-200">
                            <span class="font-semibold">মোট: ৳${order.total}</span>
                            <button onclick="cancelOrder('${order.id}')" class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded text-xs transition">
                                অর্ডার বাতিল করুন
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // ৫. EmailJS দিয়ে ইমেইল পাঠানোর ফাংশন
        function sendEmailNotification(subject, message) {
            // Note: EmailJS এ আপনার তৈরি করা Service ID এবং Template ID নিচে বসাতে হবে।
            const templateParams = {
                to_name: "Opora Admin", // আপনার নাম
                subject: subject,
                message: message
            };

            // ইমেইল ট্রিপল চেক করার জন্য কনসোলেও প্রিন্ট হবে
            console.log("Sending Email Data:", templateParams);

            // ইমেইল পাঠানোর আসল কোড (সব সেট থাকলে কাজ করবে)
            emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', templateParams)
                .then(function(response) {
                   console.log('ইমেইল সফলভাবে পাঠানো হয়েছে!', response.status, response.text);
                }, function(error) {
                   console.log('ইমেইল পাঠাতে সমস্যা হয়েছে...', error);
                });
        }

        // স্ক্রল করার সহজ ফাংশন
        function scrollToSection(id) {
            document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
        }

        // পেজ লোড হলে প্রথমবার প্রোডাক্ট দেখাবে
        window.onload = () => {
            displayProducts(products);
        };
    </script>
</body>
</html>
