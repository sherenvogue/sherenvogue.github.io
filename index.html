<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SherenVogue Meta Data & SEO for Fast Indexing -->
    <title>SherenVogue | International Luxury Brand</title>
    <meta name="description" content="Welcome to SherenVogue - International Luxury Fashion & Accessories by Founder & CEO Md. Rafiul Islam.">
    <meta name="keywords" content="SherenVogue, Luxury Fashion, Leather Bags, Premium Watches, Haute Couture, Md. Rafiul Islam">
    <meta name="author" content="Md. Rafiul Islam">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph (Social Media Share) -->
    <meta property="og:title" content="SherenVogue | Artisan Luxury">
    <meta property="og:description" content="Enter the world of SherenVogue. Discover handcrafted luxury accessories that define your unique style.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sherenvogue.com">
    <meta property="og:site_name" content="SherenVogue">

    <!-- Tailwind CSS & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #1A1A1A; 
            font-family: 'Inter', sans-serif;
        }
        .font-display { 
            font-family: 'Playfair Display', serif; 
        }
        
        /* Fade-in Animation for Center Content */
        .content-reveal {
            animation: fadeIn 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        
        @keyframes fadeIn {
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }
    </style>
</head>
<body class="relative h-screen w-screen flex items-center justify-center">

    <!-- Background Video Section with Fallback Background Color -->
    <div class="absolute inset-0 w-full h-full z-0 bg-[#1A1A1A]">
        <video autoplay loop muted playsinline class="w-full h-full object-cover">
            <!-- Video File Linked Here (Ensure background.mp4 is in the same folder) -->
            <source src="background.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <!-- Dark Gradient Overlay -->
        <div class="absolute inset-0 bg-black/50 bg-gradient-to-b from-black/40 via-transparent to-black/80"></div>
    </div>

    <!-- Center Logo & Button -->
    <div class="relative z-10 text-center flex flex-col items-center content-reveal px-4">
        
        <!-- Brand Name / Logo (Text styled as luxury logo) -->
        <h1 class="font-display text-5xl md:text-7xl font-bold tracking-tight text-white mb-2 drop-shadow-2xl">
            SHEREN<span class="italic font-light text-[#C5A059]">Vogue</span>
        </h1>
        
        <p class="text-[9px] md:text-[11px] tracking-[0.6em] uppercase text-gray-300 mb-10 md:mb-12 font-medium">
            Haute Couture Maison
        </p>

        <!-- Redirect Button -->
        <a href="shop.html" class="group relative inline-flex items-center justify-center px-10 py-3.5 md:px-12 md:py-4 border border-[#C5A059] text-[#C5A059] text-[10px] md:text-xs uppercase tracking-[0.3em] font-bold overflow-hidden transition-all hover:text-white backdrop-blur-sm shadow-xl bg-black/30">
            <span class="absolute inset-0 bg-[#C5A059] w-0 group-hover:w-full transition-all duration-700 ease-out z-0"></span>
            <span class="relative z-10 flex items-center gap-2">
                Enter Maison 
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 transition-transform group-hover:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </span>
        </a>
        
    </div>

</body>
</html>
