<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>SHERENVOGUE</title>
    
    <link rel="icon" type="image/png" href="logo1.png?v=2">
    <link rel="apple-touch-icon" href="logo1.png?v=2">

    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; media-src 'self' blob:">
    <meta name="referrer" content="no-referrer">

    <meta name="description" content="SHERENVOGUE - International luxury fashion brand. Founded by CEO Md. Rafiul Islam, Textile Engineer & Fashion Designer.">
    <meta name="keywords" content="SHERENVOGUE, Rafiul Islam, Luxury Fashion, Textile Engineer, Fashion Designer, Shirin Akter, International Brand">
    <meta name="author" content="Md. Rafiul Islam">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Noto+Serif+Bengali:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: transparent; /* Black background removed */
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Video Background Container */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background: transparent; /* Black background removed */
        }

        #bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            pointer-events: none;
        }

        /* Light Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
            pointer-events: none;
        }
        
        .content { 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100%; 
            text-align: center; 
            color: #fff; 
            z-index: 1; 
            position: relative; 
            padding: 0 20px;
            animation: fadeIn 1.2s ease-out;
        }

        h1.brand-name { 
            font-family: 'Playfair Display', serif; 
            font-size: 5rem; 
            letter-spacing: 0.15em; 
            margin-bottom: 0.5rem; 
            text-transform: uppercase; 
            font-weight: 400; 
            text-shadow: 2px 4px 20px rgba(0,0,0,0.9); 
        }
        
        h1.brand-name span { 
            font-style: italic; 
            color: #D4AF37; 
        }

        h2.subtitle { 
            font-size: 1rem; 
            letter-spacing: 0.6em; 
            color: #E5E4E2; 
            margin-bottom: 3.5rem; 
            text-transform: uppercase; 
            font-weight: 300; 
        }

        .button-group { 
            display: flex; 
            gap: 20px; 
        }
        
        .btn { 
            text-decoration: none; 
            font-size: 0.85rem; 
            letter-spacing: 0.2em; 
            padding: 16px 40px; 
            transition: transform 0.3s ease, background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease; 
            text-transform: uppercase; 
            font-weight: 600; 
            cursor: pointer; 
            backdrop-filter: blur(8px);
            border-radius: 4px;
        }

        .shop-btn { 
            color: #000; 
            background-color: #D4AF37; 
            border: 1px solid #D4AF37; 
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); 
        }
        
        .shop-btn:hover { 
            background-color: transparent; 
            color: #D4AF37; 
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.6); 
            transform: translateY(-3px); 
        }

        .story-btn { 
            color: #D4AF37; 
            background-color: rgba(0, 0, 0, 0.6); 
            border: 1px solid #D4AF37; 
        }
        
        .story-btn:hover { 
            background-color: #D4AF37; 
            color: #000; 
            transform: translateY(-3px); 
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        @media (max-width: 768px) {
            h1.brand-name { font-size: 2.5rem; letter-spacing: 0.1em; }
            h2.subtitle { font-size: 0.7rem; letter-spacing: 0.4em; margin-bottom: 2.5rem; }
            .button-group { flex-direction: column; gap: 15px; width: 100%; max-width: 280px; }
            .btn { padding: 14px 25px; width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- Cinematic Luxury Video Background -->
    <div class="video-container">
        <!-- added ./ before background.mp4 to force root directory link -->
        <video autoplay loop muted playsinline preload="auto" id="bg-video">
            <source src="./background.mp4" type="video/mp4">
        </video>
    </div>
    
    <div class="overlay"></div>

    <div class="content">
        <h1 class="brand-name">SHEREN<span>VOGUE</span></h1>
        <h2 class="subtitle">International Luxury Brand</h2>
        
        <div class="button-group">
            <button class="btn story-btn" style="display: none;">OUR STORY</button>
            <a href="shop.html" class="btn shop-btn">ENTER STORE</a>
        </div>
    </div>

</body>
</html>
