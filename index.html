<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHERENVOGUE | Haute Couture</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: #000; 
            overflow: hidden;
        }

        /* ---------------------------------------------------
           স্লাইডশো কন্টেইনার এবং ছবি
           --------------------------------------------------- */
        .slideshow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            animation: crossFade 16s infinite; /* ৪টি ছবির জন্য ১৬ সেকেন্ড */
        }

        /* ছবির ওপর হালকা কালো শ্যাডো (যেন লেখাগুলো ভাসে) */
        .slide::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); 
        }

        /* আপনার নিজের ছবির নামগুলো এখানে বসান */
        .slide-1 { background-image: url('image1.jpg'); animation-delay: 0s; }
        .slide-2 { background-image: url('image2.jpg'); animation-delay: 4s; }
        .slide-3 { background-image: url('image3.jpg'); animation-delay: 8s; }
        .slide-4 { background-image: url('image4.jpg'); animation-delay: 12s; }

        @keyframes crossFade {
            0% { opacity: 0; }
            10% { opacity: 1; }
            25% { opacity: 1; }
            35% { opacity: 0; }
            100% { opacity: 0; }
        }

        /* ---------------------------------------------------
           মেইন কন্টেন্ট (লোগো এবং বাটন)
           --------------------------------------------------- */
        .content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            color: #fff;
            z-index: 1; 
            position: relative;
        }

        h1.brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 4.5rem;
            letter-spacing: 0.15em;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            font-weight: 400;
        }

        h1.brand-name span {
            font-style: italic;
            color: #D4AF37; 
        }

        h2.subtitle {
            font-size: 0.95rem;
            letter-spacing: 0.5em;
            color: #C0C0C0;
            margin-bottom: 4rem;
            text-transform: uppercase;
            font-weight: 300;
        }

        .shop-btn {
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.25em;
            color: #fff;
            padding: 15px 45px;
            border: 1px solid #D4AF37;
            transition: all 0.4s ease;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.4); /* বাটনে ট্রান্সপারেন্ট ব্যাকগ্রাউন্ড */
        }

        .shop-btn:hover {
            background-color: #D4AF37;
            color: #000;
        }

        @media (max-width: 768px) {
            h1.brand-name { font-size: 2.8rem; letter-spacing: 0.1em; }
            h2.subtitle { font-size: 0.75rem; letter-spacing: 0.3em; margin-bottom: 3.5rem; }
        }
    </style>
</head>
<body>

    <!-- ব্যাকগ্রাউন্ড স্লাইডশো -->
    <div class="slideshow">
        <div class="slide slide-1"></div>
        <div class="slide slide-2"></div>
        <div class="slide slide-3"></div>
        <div class="slide slide-4"></div>
    </div>

    <!-- ফ্রন্ট কন্টেন্ট -->
    <div class="content">
        <h1 class="brand-name">SHEREN<span>VOGUE</span></h1>
        <h2 class="subtitle">Haute Couture</h2>
        <a href="shop.html" class="shop-btn">ENTER STORE</a>
    </div>

</body>
</html>
