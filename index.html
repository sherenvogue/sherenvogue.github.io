<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHERENVOGUE | Haute Couture</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* বেসিক রিসেট */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            /* একটি রিচ ডার্ক গোল্ডেন ব্যাকগ্রাউন্ড অ্যানিমেশন */
            background: radial-gradient(circle at center, #1f1a10 0%, #0a0a0a 70%, #000000 100%);
        }

        /* ---------------------------------------------------
           অ্যানিমেটেড ব্যাকগ্রাউন্ড ইফেক্ট (CSS Glow & Dust)
           --------------------------------------------------- */
        .glow-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(212, 175, 55, 0.05), rgba(0, 0, 0, 0), rgba(212, 175, 55, 0.05));
            animation: pulseGlow 8s infinite alternate;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(1.05); }
        }

        /* ---------------------------------------------------
           মেইন কন্টেন্ট (লোগো এবং বাটন)
           --------------------------------------------------- */
        .content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            color: #fff;
            z-index: 1;
            position: relative;
            animation: fadeIn 2.5s ease-in-out;
        }

        h1.brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 5rem; /* একটু বড় করা হয়েছে */
            letter-spacing: 0.15em;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            font-weight: 400;
            /* টেক্সটের চারপাশে একটি সুন্দর গোল্ডেন গ্লো */
            text-shadow: 0px 4px 20px rgba(212, 175, 55, 0.3);
        }

        h1.brand-name span {
            font-style: italic;
            color: #D4AF37; /* লাক্সারি গোল্ডেন কালার */
        }

        h2.subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.6em;
            color: #b3b3b3;
            margin-bottom: 4rem;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* ---------------------------------------------------
           লাক্সারি বাটন ডিজাইন (ভিডিওর মতো হুবহু)
           --------------------------------------------------- */
        .shop-btn {
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.25em;
            color: #D4AF37;
            padding: 18px 50px;
            border: 1px solid #D4AF37; /* সলিড গোল্ডেন বর্ডার */
            background-color: transparent;
            transition: all 0.5s ease;
            text-transform: uppercase;
            font-weight: 400;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        /* বাটনের হোভার ইফেক্ট (মাউস নিলে কালার চেঞ্জ হবে) */
        .shop-btn:hover {
            background-color: #D4AF37;
            color: #000;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
            transform: translateY(-3px);
        }

        /* ---------------------------------------------------
           অ্যানিমেশন কি-ফ্রেমস
           --------------------------------------------------- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---------------------------------------------------
           মোবাইল রেসপন্সিভ ডিজাইন
           --------------------------------------------------- */
        @media (max-width: 768px) {
            h1.brand-name {
                font-size: 3rem;
                letter-spacing: 0.1em;
            }
            h2.subtitle {
                font-size: 0.8rem;
                letter-spacing: 0.4em;
                margin-bottom: 3.5rem;
            }
            .shop-btn {
                padding: 15px 40px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="glow-overlay"></div>

    <div class="content">
        <h1 class="brand-name">SHEREN<span>VOGUE</span></h1>
        <h2 class="subtitle">Haute Couture</h2>
        
        <a href="shop.html" class="shop-btn">ENTER STORE</a>
    </div>

</body>
</html>
