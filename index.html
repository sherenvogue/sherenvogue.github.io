<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SherenVogue | Welcome</title>
    <style>
        /* =========================================
           Reset & Base Styles
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100dvh; /* 100dvh for perfect mobile Safari sizing */
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #050505;
            overflow: hidden; /* Prevents scrollbars during animation */
        }

        /* =========================================
           Background Animation
           ========================================= */
        .splash-container {
            position: relative;
            width: 100%;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 50%, #050505 100%);
            background-size: 200% 200%;
            animation: bgShift 15s ease infinite;
        }

        /* অপশনাল: ভিডিও ব্যাকগ্রাউন্ড ব্যবহার করতে চাইলে নিচের কোডটি আনকমেন্ট করুন */
        /*
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.4;
            z-index: 0;
        }
        */

        @keyframes bgShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* =========================================
           Content Overlay & Typography
           ========================================= */
        .content-wrapper {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .brand-name {
            font-family: 'Times New Roman', Times, serif;
            font-size: 4rem;
            color: #ffffff;
            letter-spacing: 8px;
            text-transform: uppercase;
            font-weight: 400;
            opacity: 0;
            animation: fadeInUp 1.5s ease forwards 0.5s;
        }

        .brand-subtitle {
            font-size: 0.9rem;
            color: #c7a17a; /* Luxury Gold Tone */
            letter-spacing: 6px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInUp 1.5s ease forwards 1s;
        }

        /* =========================================
           Shopping Button
           ========================================= */
        .shop-btn-container {
            margin-top: 30px;
            opacity: 0;
            animation: fadeInUp 1.5s ease forwards 1.5s;
        }

        .shop-btn {
            display: inline-block;
            padding: 16px 45px;
            font-size: 1rem;
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid #c7a17a;
            background: transparent;
            position: relative;
            overflow: hidden;
            transition: color 0.4s ease, transform 0.3s ease;
            cursor: pointer;
        }

        /* Button Hover Fill Effect */
        .shop-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background-color: #c7a17a;
            transition: left 0.4s ease;
            z-index: -1;
        }

        .shop-btn:hover::before {
            left: 0;
        }

        .shop-btn:hover {
            color: #000000;
            font-weight: 600;
            transform: translateY(-3px); /* Slight lift effect */
            box-shadow: 0 10px 20px rgba(199, 161, 122, 0.2);
        }

        /* =========================================
           Keyframe Animations
           ========================================= */
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================
           Responsive Design (Mobile Devices)
           ========================================= */
        @media (max-width: 768px) {
            .brand-name {
                font-size: 2.5rem;
                letter-spacing: 4px;
            }
            .brand-subtitle {
                font-size: 0.75rem;
                letter-spacing: 4px;
            }
            .shop-btn {
                padding: 14px 35px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="splash-container">
        <!-- 
            যদি পরবর্তীতে আপনার তৈরি কোনো সিনেমাটিক ড্রোন শট বা 3D ডিজাইনের ভিডিও 
            ব্যাকগ্রাউন্ডে দিতে চান, তবে নিচের কোডটি আনকমেন্ট করে 'your-video.mp4' এর জায়গায় ভিডিওর লিংক বসিয়ে দিন। 
        -->
        <!-- 
        <video class="bg-video" autoplay loop muted playsinline>
            <source src="your-video.mp4" type="video/mp4">
        </video> 
        -->

        <div class="content-wrapper">
            <h1 class="brand-name">Sheren<span style="color: #c7a17a; font-style: italic;">Vogue</span></h1>
            <div class="brand-subtitle">Haute Couture</div>
            
            <div class="shop-btn-container">
                <!-- href এর জায়গায় আপনার মূল শপিং পেজ বা ওয়েবসাইটের লিংক দিন -->
                <a href="/shop" class="shop-btn">Enter Store</a>
            </div>
        </div>
    </div>

</body>
</html>
