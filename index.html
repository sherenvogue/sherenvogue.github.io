<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SherenVogue | Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Times New Roman', Times, serif;
        }

        .splash-container {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #050505;
        }

        .bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 1;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.75));
            z-index: 2;
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .brand-name {
            font-family: 'Times New Roman', Times, serif;
            font-size: 4rem;
            color: #ffffff;
            letter-spacing: 8px;
            text-transform: uppercase;
            font-weight: 400;
            opacity: 0;
            animation: fadeInUp 1.5s ease forwards 0.5s;
        }

        .brand-subtitle {
            font-size: 0.9rem;
            color: #c7a17a;
            letter-spacing: 6px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInUp 1.5s ease forwards 1s;
        }

        .shop-btn-container {
            margin-top: 30px;
            opacity: 0;
            animation: fadeInUp 1.5s ease forwards 1.5s;
        }

        .shop-btn {
            display: inline-block;
            padding: 16px 45px;
            font-size: 1rem;
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid #c7a17a;
            background: transparent;
            position: relative;
            overflow: hidden;
            transition: color 0.4s ease, transform 0.3s ease;
            cursor: pointer;
        }

        .shop-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background-color: #c7a17a;
            transition: left 0.4s ease;
            z-index: -1;
        }

        .shop-btn:hover::before {
            left: 0;
        }

        .shop-btn:hover {
            color: #000000;
            font-weight: 600;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(199, 161, 122, 0.3);
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .brand-name {
                font-size: 2.5rem;
                letter-spacing: 4px;
            }
            .brand-subtitle {
                font-size: 0.75rem;
            }
            .shop-btn {
                padding: 14px 35px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="splash-container">
        <video class="bg-video" autoplay loop muted playsinline>
            <source src="https://assets.mixkit.co/videos/preview/mixkit-luxury-fashion-store-with-mannequins-41655-large.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <div class="video-overlay"></div>

        <div class="content-wrapper">
            <h1 class="brand-name">Sheren<span style="color: #c7a17a; font-style: italic;">Vogue</span></h1>
            <div class="brand-subtitle">Haute Couture</div>
            
            <div class="shop-btn-container">
                <a href="shop.html" class="shop-btn">Enter Store</a>
            </div>
        </div>
    </div>

</body>
</html>
