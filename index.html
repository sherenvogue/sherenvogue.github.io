<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO & Brand Identification Meta Tags -->
  <title>SherenVogue | International Luxury Haute Couture & Bespoke Collection</title>
  <meta name="description" content="SherenVogue is an international luxury haute couture brand specializing in bespoke artisan leather bags, timepieces, and accessories. Founded by CEO Md. Rafiul Islam. Support: hello@sherenvogue.com">
  <meta name="author" content="Md. Rafiul Islam">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-display { font-family: 'Cinzel', serif; }
    .category-blur-box { background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%); }
  </style>
</head>

<body class="bg-stone-50 text-neutral-900 min-h-screen flex flex-col antialiased">

  <!-- Top Announcement Bar -->
  <div class="bg-neutral-900 text-amber-200 text-[9px] uppercase tracking-[0.35em] py-2.5 text-center font-medium px-4">
    Complimentary Worldwide Shipping on Orders Over ৳5000 | Support: hello@sherenvogue.com
  </div>

  <!-- Main Navigation -->
  <nav class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-gray-100 px-4 md:px-12 py-3.5 md:py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="hidden md:flex gap-8 items-center">
        <a href="javascript:void(0)" onclick="showPage('shop'); filterCategory('all');" class="text-[11px] uppercase tracking-widest font-medium hover:text-amber-600 transition-colors">Collections</a>
        <a href="javascript:void(0)" onclick="showPage('shop'); filterCategory('bags');" class="text-[11px] uppercase tracking-widest font-medium hover:text-amber-600 transition-colors">Bespoke Bags</a>
      </div>
      
      <a href="javascript:void(0)" onclick="showPage('home')" class="flex flex-col text-center group">
        <span class="font-display text-xl md:text-2xl font-bold tracking-tight leading-none text-neutral-900">
          SHEREN<span class="italic font-light text-amber-600">Vogue</span>
        </span>
        <span class="text-[6px] md:text-[7px] tracking-[0.6em] uppercase text-gray-400 mt-1 block font-medium">Haute Couture</span>
      </a>

      <div class="flex items-center gap-4 md:gap-5">
        <button type="button" onclick="showPage('shop')" class="p-1 text-gray-700 hover:text-amber-600 transition-colors" title="Search"><i data-lucide="search" class="w-4 h-4 md:w-5 md:h-5 stroke-[1.5]"></i></button>
        <button type="button" onclick="showPage('history')" class="p-1 text-gray-700 hover:text-amber-600 transition-colors" title="Order History"><i data-lucide="clock" class="w-4 h-4 md:w-5 md:h-5 stroke-[1.5]"></i></button>
        <button type="button" onclick="showPage('cart')" class="relative p-1 text-gray-700 hover:text-amber-600 transition-colors" title="Cart">
          <i data-lucide="shopping-bag" class="w-4 h-4 md:w-5 md:h-5 stroke-[1.5]"></i>
          <span id="cart-count" class="absolute -top-1 -right-1 bg-amber-600 text-white text-[8px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Pages Container -->
  <main id="pages-container" class="flex-grow">
    
    <!-- HOME PAGE -->
    <div id="page-home" class="page-view">
      <div class="max-w-5xl mx-auto px-4 pt-4 md:pt-6">
        
        <!-- Banner (Keeping Unsplash for Banner as it looks professional) -->
        <div class="relative rounded-3xl overflow-hidden shadow-sm bg-stone-200 aspect-[16/10] md:aspect-[21/9] flex items-center">
          <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=1600&auto=format&fit=crop" class="w-full h-full object-cover object-center opacity-85 mix-blend-multiply filter contrast-105" alt="Banner">
            <div class="absolute inset-0 bg-gradient-to-r from-black/50 via-black/20 to-transparent"></div>
          </div>
          <div class="relative z-10 pl-5 md:pl-16 text-white max-w-xs md:max-w-md">
            <p class="text-[8px] md:text-[11px] uppercase tracking-[0.4em] text-amber-200 mb-1 md:mb-2 font-semibold">New Collection 2026</p>
            <h1 class="font-display text-2xl md:text-5xl font-bold leading-tight tracking-tight mb-3 md:mb-4 text-white">Timeless <br>Elegance</h1>
            <button type="button" onclick="showPage('shop')" class="inline-flex items-center gap-2 text-[10px] md:text-xs uppercase tracking-widest font-semibold border-b-2 border-white pb-0.5 hover:text-amber-200 hover:border-amber-200 transition-all">
              Shop Now <i data-lucide="arrow-right" class="w-3 h-3"></i>
            </button>
          </div>
        </div>

        <!-- Featured Masterpieces Section (Includes Facebook Sync Target) -->
        <section class="my-10 md:my-12">
          <div class="flex justify-between items-center mb-5">
            <h2 class="text-[10px] md:text-xs uppercase tracking-[0.3em] font-bold text-neutral-900">Featured & Latest (FB)</h2>
            <button type="button" onclick="showPage('shop')" class="text-[9px] md:text-[10px] uppercase tracking-widest font-bold text-amber-600 border-b border-amber-600 pb-0.5">See All</button>
          </div>
          <!-- Target Grid for Featured & Facebook Posts -->
          <div id="featured-products" class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4"></div>
        </section>

      </div>
    </div>

    <!-- SHOP PAGE -->
    <div id="page-shop" class="page-view hidden">
      <div class="py-6 md:py-8 bg-white text-center border-b border-gray-100">
        <h1 class="font-display text-2xl md:text-3xl mb-2 font-bold text-neutral-900">Maison Collection</h1>
        <div class="max-w-md mx-auto px-4 mt-4 mb-3">
          <div class="relative">
            <input type="text" id="shop-search" oninput="handleSearch(this.value)" placeholder="Search for bags, watches, rings..." class="w-full border border-gray-200 rounded-full px-4 py-2.5 text-xs focus:outline-none focus:border-amber-600 bg-stone-50">
            <i data-lucide="search" class="absolute right-4 top-2.5 w-4 h-4 text-gray-400"></i>
          </div>
        </div>
        <div id="category-filters" class="flex justify-center gap-4 md:gap-5 flex-wrap mt-2 px-4">
          <button type="button" onclick="filterCategory('all')" id="filter-all" class="text-[9px] md:text-[10px] uppercase tracking-[0.2em] font-bold pb-1 border-b-2 border-amber-600 text-amber-600">Everything</button>
          <button type="button" onclick="filterCategory('bags')" id="filter-bags" class="text-[9px] md:text-[10px] uppercase tracking-[0.2em] font-bold pb-1 border-b-2 border-transparent text-gray-400">Bespoke Bags</button>
          <button type="button" onclick="filterCategory('watches')" id="filter-watches" class="text-[9px] md:text-[10px] uppercase tracking-[0.2em] font-bold pb-1 border-b-2 border-transparent text-gray-400">Timepieces</button>
        </div>
      </div>
      <div class="max-w-7xl mx-auto px-3 md:px-4 py-6 md:py-8">
        <div id="shop-products" class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4"></div>
      </div>
    </div>

    <!-- CART, HISTORY & CHECKOUT PAGES (Original structure preserved) -->
    <div id="page-cart" class="page-view hidden">
      <div class="max-w-2xl mx-auto px-4 py-8 md:py-10">
        <h1 class="font-display text-2xl md:text-3xl mb-6 md:mb-8 font-bold text-center text-neutral-900">Your Atelier Bag</h1>
        <div id="cart-container" class="bg-white rounded-2xl border border-gray-100 p-5 md:p-6 shadow-sm"></div>
      </div>
    </div>

    <!-- ... (History, Checkout, Success pages remain completely unchanged, keeping your original JS functions intact) ... -->
    
  </main>

  <!-- Product Modal -->
  <div id="product-modal" class="fixed inset-0 z-[100] bg-black/60 backdrop-blur-xs flex items-center justify-center hidden p-4">
    <div class="bg-white max-w-2xl w-full max-h-[85vh] overflow-y-auto relative rounded-3xl border border-gray-100 flex flex-col md:flex-row shadow-xl">
      <button type="button" onclick="closeProductModal()" class="absolute top-4 right-4 z-10 w-8 h-8 bg-white/80 rounded-full flex items-center justify-center text-gray-500 hover:text-black shadow-sm">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
      <div id="modal-img-container" class="w-full md:w-1/2 bg-stone-50 flex items-center justify-center p-4 aspect-square md:aspect-auto"></div>
      <div class="w-full md:w-1/2 p-6 md:p-8 flex flex-col justify-between bg-white">
        <div>
          <p id="modal-product-cat" class="text-[8px] uppercase tracking-[0.3em] text-amber-600 mb-1 font-bold"></p>
          <h2 id="modal-product-name" class="font-display text-xl md:text-2xl font-bold mb-2 text-neutral-900"></h2>
          <p id="modal-product-price" class="font-bold text-base text-gray-800 mb-3"></p>
          <hr class="border-gray-100 my-3">
          <p id="modal-product-desc" class="text-gray-400 text-xs leading-relaxed mb-5"></p>
        </div>
        <button type="button" id="modal-add-btn" class="w-full bg-neutral-900 text-white py-3.5 text-[10px] uppercase tracking-widest font-bold rounded-xl hover:bg-amber-600 transition-all shadow-sm">
          Add to Bag
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN JAVASCRIPT SYSTEM -->
  <script>
    // 1. PRODUCTS DATA (RESTORED TO YOUR ORIGINAL LOCAL IMAGES)
    // Please ensure these images are present in the same folder as this HTML file.
    const products = [
      { id: 101, name: "Wings Blush Ring Crossbody", category: "bags", rawPrice: 6800, price: "৳6,800", image: "1000068167.png", desc: "Blush pink luxury leather with polished metallic ring handle and signature SherenVogue gold winged emblem." },
      { id: 102, name: "Wings Magenta Ring Crossbody", category: "bags", rawPrice: 6800, price: "৳6,800", image: "1000068169.png", desc: "Deep magenta textured leather featuring a circular top handle and gold winged emblem." },
      { id: 103, name: "Imperial Emerald Paisley Trapeze", category: "bags", rawPrice: 8500, price: "৳8,500", image: "1000067126.png", desc: "Woven paisley brocade side panels with structured emerald green leather and crown clasp." },
      { id: 104, name: "Imperial Burgundy Paisley Trapeze", category: "bags", rawPrice: 8500, price: "৳8,500", image: "1000067125.png", desc: "Woven paisley brocade side panels with rich burgundy leather and gold crown clasp." },
      { id: 105, name: "Heritage Crest Leather Satchel", category: "bags", rawPrice: 7500, price: "৳7,500", image: "1000066948.png", desc: "Pebbled espresso brown leather with contrasting tan stitched trims and winged emblem." },
      { id: 106, name: "Luminary Pearl Beige Watch", category: "watches", rawPrice: 5800, price: "৳5,800", image: "1000066019.png", desc: "Iridescent Mother-of-Pearl dial studded with crystal markers and premium beige leather strap." },
      { id: 107, name: "Obsidian Sculptural Crossbody", category: "bags", rawPrice: 9200, price: "৳9,200", image: "1000024543.png", desc: "Structured matte black leather with metallic top handle, chain strap, and winged emblem." },
      { id: 108, name: "Private Member Black Satchel", category: "bags", rawPrice: 8900, price: "৳8,900", image: "1000024538.png", desc: "Pebbled black genuine leather with luxury gold chain accent and winged crown crest." },
      { id: 109, name: "Diamond Sovereign Horology Watch", category: "watches", rawPrice: 14500, price: "৳14,500", image: "1000024539.png", desc: "High-complication rose gold timepiece paved with crystal diamonds and mother-of-pearl dial." },
      { id: 110, name: "Luminary Mesh Rose Gold Watch", category: "watches", rawPrice: 6500, price: "৳6,500", image: "1000024541.png", desc: "Sleek rose gold mesh strap watch with mother-of-pearl dial and crystal indices." }
    ];

    let cart = [];

    // ... (Your existing showPage, renderShopProducts, filterCategory, cart management functions remain exactly the same) ...
    
    // Core Navigation & Rendering (Abbreviated for clarity, KEEP YOUR EXISTING FUNCTIONS HERE)
    function showPage(pageId) {
      document.querySelectorAll('.page-view').forEach(p => p.classList.add('hidden'));
      document.getElementById('page-' + pageId).classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      if (pageId === 'cart') renderCart();
      if (window.lucide) lucide.createIcons();
    }

    function renderShopProducts(items) {
      const shopContainer = document.getElementById('shop-products');
      if (!shopContainer) return;
      shopContainer.innerHTML = items.map(p => `
        <div class="bg-white rounded-2xl border border-gray-100 p-3 shadow-sm group flex flex-col justify-between">
          <div>
            <div class="aspect-square rounded-xl overflow-hidden bg-stone-50 mb-3 cursor-pointer" onclick="openProductModal(${p.id})">
              <img src="${p.image}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/600x600?text=SherenVogue'" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
            </div>
            <p class="text-[8px] uppercase tracking-[0.2em] text-amber-600 font-bold mb-0.5">${p.category}</p>
            <h3 class="font-display text-xs font-bold text-neutral-900 truncate cursor-pointer" onclick="openProductModal(${p.id})">${p.name}</h3>
            <p class="text-xs font-bold text-gray-800 mt-1">${p.price}</p>
          </div>
          <button type="button" onclick="addToCart(${p.id})" class="w-full mt-3 bg-neutral-900 text-white py-2 text-[9px] uppercase tracking-widest font-bold rounded-lg hover:bg-amber-600 transition-all">Add To Bag</button>
        </div>
      `).join('');
    }

    function openProductModal(id) {
      const p = products.find(item => item.id === id);
      document.getElementById('modal-img-container').innerHTML = `<img src="${p.image}" onerror="this.src='https://via.placeholder.com/600x600?text=SherenVogue'" class="max-h-64 w-full object-cover rounded-xl" alt="${p.name}" />`;
      document.getElementById('modal-product-cat').innerText = p.category;
      document.getElementById('modal-product-name').innerText = p.name;
      document.getElementById('modal-product-price').innerText = p.price;
      document.getElementById('modal-product-desc').innerText = p.desc;
      document.getElementById('modal-add-btn').onclick = function() { addToCart(p.id); closeProductModal(); };
      document.getElementById('product-modal').classList.remove('hidden');
    }
    function closeProductModal() { document.getElementById('product-modal').classList.add('hidden'); }
    function addToCart(id) {
       // Your exact logic
       const p = products.find(item => item.id === id);
       const existing = cart.find(item => item.id === id);
       if(existing) existing.qty += 1; else cart.push({...p, qty: 1});
       document.getElementById('cart-count').innerText = cart.reduce((sum, item) => sum + item.qty, 0);
       alert(`"${p.name}" added to your Atelier Bag!`);
    }

    // UPDATED FACEBOOK SYNC LOGIC
    document.addEventListener('DOMContentLoaded', function() {
      if (window.lucide) lucide.createIcons();

      // Render your initial fixed products first
      const featuredGrid = document.getElementById('featured-products');
      const featuredItems = products.slice(0, 4); // Display 4 original items
      featuredGrid.innerHTML = featuredItems.map(p => `
        <div class="bg-white rounded-2xl border border-gray-100 p-3 shadow-sm group flex flex-col justify-between">
          <div>
            <div class="aspect-square rounded-xl overflow-hidden bg-stone-50 mb-3 cursor-pointer" onclick="openProductModal(${p.id})">
              <img src="${p.image}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/600x600?text=SherenVogue'" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
            </div>
            <p class="text-[8px] uppercase tracking-[0.2em] text-amber-600 font-bold mb-0.5">${p.category}</p>
            <h3 class="font-display text-xs font-bold text-neutral-900 truncate cursor-pointer" onclick="openProductModal(${p.id})">${p.name}</h3>
            <p class="text-xs font-bold text-gray-800 mt-1">${p.price}</p>
          </div>
          <button type="button" onclick="addToCart(${p.id})" class="w-full mt-3 bg-neutral-900 text-white py-2 text-[9px] uppercase tracking-widest font-bold rounded-lg hover:bg-amber-600 transition-all">Add To Bag</button>
        </div>
      `).join('');
      
      renderShopProducts(products);

      // Fetch dynamic Facebook Posts
      fetch('posts.json')
        .then(res => res.json())
        .then(data => {
          // This allows posts.json to hold MULTIPLE facebook posts (Array)
          const postsArray = Array.isArray(data) ? data : [data];
          
          postsArray.forEach(post => {
            if (post && post.image) {
              const postMsg = post.message ? post.message : 'New Arrival from FB';
              const shortMsg = postMsg.length > 40 ? postMsg.substring(0, 40) + '...' : postMsg;

              const fbCardHTML = `
                <div class="relative rounded-2xl overflow-hidden bg-amber-50/50 border border-amber-200/50 p-3 shadow-sm group transition-all duration-300 hover:shadow-md flex flex-col justify-between">
                  <div>
                    <div class="relative aspect-square w-full rounded-xl overflow-hidden bg-stone-50 mb-3">
                      <img src="${post.image}" alt="Facebook Sync" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                      <span class="absolute top-2 left-2 bg-blue-600/90 text-white text-[7px] uppercase font-bold tracking-widest px-2 py-1 rounded-full shadow-sm flex items-center gap-1">
                        <i data-lucide="facebook" class="w-2 h-2"></i> FB Post
                      </span>
                    </div>
                    <p class="text-[8px] uppercase tracking-[0.25em] text-blue-600 font-bold mb-0.5">Social Update</p>
                    <h3 class="font-display text-xs font-bold text-neutral-900 mb-1 leading-tight">${shortMsg}</h3>
                  </div>
                  <a href="${post.link || 'javascript:void(0)'}" target="_blank" class="block text-center w-full mt-3 bg-neutral-900 text-amber-200 py-2 text-[9px] uppercase tracking-widest font-bold rounded-lg hover:bg-amber-600 hover:text-white transition-all">
                    View Details
                  </a>
                </div>
              `;

              // Insert Facebook posts at the BEGINNING of the featured grid
              featuredGrid.insertAdjacentHTML('afterbegin', fbCardHTML);
              if(window.lucide) lucide.createIcons();
            }
          });
        })
        .catch(err => console.log('Facebook posts sync resting:', err));
    });
  </script>
</body>
</html>
