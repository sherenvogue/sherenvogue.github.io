<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHERENVOGUE | Haute Couture</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: #050505; 
            overflow: hidden;
        }

        /* ---------------------------------------------------
           ভিডিও ব্যাকগ্রাউন্ড সেকশন
           --------------------------------------------------- */
        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -2; /* ভিডিও সবার পিছনে রাখার জন্য */
        }

        .video-container video {
            min-width: 100%;
            min-height: 100%;
            object-fit: cover; /* সব স্ক্রিনে ফিট হওয়ার জন্য */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* ভিডিওটি একটু ডার্ক করা হয়েছে যেন সামনের লেখা স্পষ্ট বোঝা যায় */
            filter: brightness(0.4) contrast(1.2); 
        }

        /* ---------------------------------------------------
           আপনার দেওয়া সামনের কন্টেন্টের কোড (অপরিবর্তিত)
           --------------------------------------------------- */
        .content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            color: #fff;
            z-index: 1; /* লেখা ভিডিওর সামনে রাখার জন্য */
            position: relative;
            animation: fadeIn 2s ease-in-out;
        }

        h1.brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 4.5rem;
            letter-spacing: 0.15em;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            font-weight: 400;
            text-shadow: 2px 4px 15px rgba(0,0,0,0.8);
        }

        h1.brand-name span {
            font-style: italic;
            color: #D4AF37; 
        }

        h2.subtitle {
            font-size: 0.95rem;
            letter-spacing: 0.5em;
            color: #C0C0C0;
            margin-bottom: 4rem;
            text-transform: uppercase;
            font-weight: 300;
        }

        .shop-btn {
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.25em;
            color: #111;
            background: linear-gradient(60deg, #C5A059, #F3E5AB, #C5A059, #D4AF37);
            background-size: 300% 300%;
            padding: 16px 45px;
            border: 1px solid #F3E5AB;
            border-radius: 2px;
            transition: all 0.4s ease;
            text-transform: uppercase;
            font-weight: 600;
            animation: goldShimmer 3.5s ease infinite;
            cursor: pointer;
        }

        .shop-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 35px rgba(212, 175, 55, 0.4);
            border-color: #FFF;
            color: #000;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes goldShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @media (max-width: 768px) {
            h1.brand-name {
                font-size: 2.8rem;
                letter-spacing: 0.1em;
            }
            h2.subtitle {
                font-size: 0.75rem;
                letter-spacing: 0.3em;
                margin-bottom: 3.5rem;
            }
            .shop-btn {
                padding: 15px 35px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- সরাসরি ইন্টারনেট থেকে ভিডিও প্লে হবে, কোনো ফাইল লাগবে না -->
    <div class="video-container">
        <video autoplay loop muted playsinline>
            <source src="https://assets.mixkit.co/videos/preview/mixkit-golden-particles-in-the-air-4876-large.mp4" type="video/mp4">
        </video>
    </div>

    <!-- আপনার মেইন কন্টেন্ট -->
    <div class="content">
        <h1 class="brand-name">SHEREN<span>VOGUE</span></h1>
        <h2 class="subtitle">Haute Couture</h2>
        <a href="shop.html" class="shop-btn">Enter Store</a>
    </div>

</body>
</html>
