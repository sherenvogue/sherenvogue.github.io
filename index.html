<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>SherenVogue - Premium Online Shopping</title>
    <meta name="description" content="Shop the latest fashion and lifestyle trends at SherenVogue. Fast shipping, easy checkout, and seamless order management.">
    <meta name="keywords" content="SherenVogue, online shopping, fashion shop, buy products online, sherenvogue.com, bangladesh ecommerce">
    <meta name="robots" content="index, follow">
    <meta name="author" content="SherenVogue">
    
    <link rel="canonical" href="https://sherenvogue.com/">
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="SherenVogue - Premium Online Shopping">
    <meta property="og:description" content="Explore top-quality products on SherenVogue with fast delivery and hassle-free return/cancel options.">
    <meta property="og:url" content="https://sherenvogue.com/">
    <meta property="og:site_name" content="SherenVogue">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // !!! এখানে আপনার EmailJS Public Key বসাবেন !!!
            emailjs.init("YOUR_EMAILJS_PUBLIC_KEY"); 
        })();
    </script>
</head>
<body class="bg-gray-50 font-sans">

    <header class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <a href="https://sherenvogue.com" class="text-2xl font-extrabold tracking-wider text-amber-400">SherenVogue</a>
            
            <div class="relative w-full md:w-1/2">
                <input type="text" id="searchBar" placeholder="প্রোডাক্ট খুঁজুন (যেমন: Phone, Laptop, Dress...)" class="w-full p-2 pl-4 rounded-lg text-gray-800 focus:outline-none focus:ring-2 focus:ring-amber-400">
            </div>
            
            <div class="flex gap-4">
                <button onclick="scrollToSection('cart-section')" class="bg-slate-800 px-4 py-2 rounded-lg border border-amber-400 hover:bg-slate-700 transition">
                    কার্ট (<span id="cartCount" class="text-amber-400">0</span>)
                </button>
                <button onclick="scrollToSection('order-section')" class="bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-lg hover:bg-amber-400 transition">
                    অর্ডার ট্র্যাক (<span id="orderCount">0</span>)
                </button>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <section class="lg:col-span-2">
            <h2 class="text-xl font-bold mb-4 text-slate-800 border-l-4 border-amber-500 pl-2">আমাদের এক্সক্লুসিভ কালেকশন</h2>
            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                </div>
        </section>

        <aside class="space-y-6">
            
            <div id="cart-section" class="bg-white p-4 rounded-xl shadow-md border border-gray-100">
                <h2 class="text-xl font-bold mb-4 text-slate-800 border-b pb-2">শপিং কার্ট</h2>
                <div id="cartItems" class="space-y-3 max-h-60 overflow-y-auto mb-4">
                    <p class="text-gray-400 text-center py-4">আপনার কার্টটি এখন খালি আছে</p>
                </div>
                <div class="flex justify-between font-bold text-lg mb-4 border-t pt-2">
                    <span>সর্বমোট মূল্য:</span>
                    <span class="text-amber-600">৳<span id="cartTotal">0</span></span>
                </div>
                <button id="checkoutBtn" onclick="confirmOrder()" class="w-full bg-slate-900 text-amber-400 py-3 rounded-lg font-bold hover:bg-slate-800 transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    অর্ডার কনফার্ম করুন
                </button>
            </div>

            <div id="order-section" class="bg-white p-4 rounded-xl shadow-md border border-gray-100">
                <h2 class="text-xl font-bold mb-4 text-emerald-600 border-b pb-2">আপনার কনফার্মড অর্ডার</h2>
                <div id="orderStatusList" class="space-y-4">
                    <p class="text-gray-400 text-center py-4">এখনো কোনো অর্ডার প্লেস করা হয়নি</p>
                </div>
            </div>

        </aside>
    </main>

    <script>
        // প্রোডাক্ট ডাটাবেস (আপনার ইচ্ছেমতো নাম ও দাম পরিবর্তন করতে পারেন)
        const products = [
            { id: 1, name: "Premium Smart Phone", price: 25000, category: "electronics", img: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=300" },
            { id: 2, name: "Luxury Wireless Headphones", price: 3500, category: "audio", img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300" },
            { id: 3, name: "Sleek Ultrabook Laptop", price: 55000, category: "electronics", img: "https://images.unsplash.com/photo-1496181130204-755241524eab?w=300" },
            { id: 4, name: "Vogue Edition Smart Watch", price: 4500, category: "accessories", img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300" }
        ];

        let cart = [];
        let orders = [];

        // ১. প্রোডাক্ট রেন্ডার এবং ইনস্ট্যান্ট সার্চবার ওয়ার্কিং
        function displayProducts(productsToRender) {
            const productGrid = document.getElementById('productGrid');
            productGrid.innerHTML = "";
            
            if(productsToRender.length === 0) {
                productGrid.innerHTML = `<p class="text-gray-500 col-span-2 text-center py-8">দুঃখিত, কোনো প্রোডাক্ট খুঁজে পাওয়া যায়নি!</p>`;
                return;
            }

            productsToRender.forEach(product => {
                productGrid.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow-sm hover:shadow-md transition flex flex-col justify-between border border-gray-100">
                        <img src="${product.img}" alt="${product.name}" class="w-full h-44 object-cover rounded-lg mb-3">
                        <div>
                            <h3 class="font-bold text-lg text-slate-800">${product.name}</h3>
                            <p class="text-amber-600 font-bold mt-1 text-xl">৳${product.price}</p>
                        </div>
                        <button onclick="addToCart(${product.id})" class="mt-4 w-full bg-slate-900 hover:bg-slate-800 text-amber-400 py-2.5 rounded-md transition text-sm font-bold tracking-wide">
                            কার্টে যোগ করুন
                        </button>
                    </div>
                `;
            });
        }

        // রিয়েল-টাইম সার্চ লিসেনার
        document.getElementById('searchBar').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredProducts = products.filter(product => 
                product.name.toLowerCase().includes(searchTerm)
            );
            displayProducts(filteredProducts);
        });

        // ২. কার্ট হ্যান্ডলিং
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const cartItem = cart.find(item => item.id === id);

            if (cartItem) {
                cartItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cartItems');
            const cartCount = document.getElementById('cartCount');
            const cartTotal = document.getElementById('cartTotal');
            const checkoutBtn = document.getElementById('checkoutBtn');

            cartItemsContainer.innerHTML = "";
            let total = 0;
            let count = 0;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `<p class="text-gray-400 text-center py-4">আপনার কার্টটি এখন খালি আছে</p>`;
                checkoutBtn.disabled = true;
            } else {
                checkoutBtn.disabled = false;
                cart.forEach(item => {
                    total += item.price * item.quantity;
                    count += item.quantity;
                    cartItemsContainer.innerHTML += `
                        <div class="flex justify-between items-center bg-slate-50 p-3 rounded-lg border border-gray-100 text-sm">
                            <div class="flex-1">
                                <h4 class="font-bold text-slate-800">${item.name}</h4>
                                <p class="text-gray-500 font-medium">৳${item.price} x ${item.quantity}</p>
                            </div>
                            <button onclick="removeFromCart(${item.id})" class="text-rose-500 hover:text-rose-700 ml-2 font-bold p-1">✕</button>
                        </div>
                    `;
                });
            }

            cartCount.innerText = count;
            cartTotal.innerText = total;
        }

        // ৩. অর্ডার কনফার্মেশন এবং মেইল অ্যালার্ট
        function confirmOrder() {
            if (cart.length === 0) return;

            const orderId = '#SV' + Math.floor(100000 + Math.random() * 900000);
            const currentOrder = {
                id: orderId,
                items: [...cart],
                total: document.getElementById('cartTotal').innerText,
                date: new Date().toLocaleString('bn-BD')
            };

            orders.push(currentOrder);
            
            // মেইল ডাটা প্রিপারেশন
            let productDetails = cart.map(item => `${item.name} (${item.quantity}টি) - ৳${item.price * item.quantity}`).join(', ');
            
            sendEmailNotification(
                "নতুন অর্ডার এসেছে! 🎉 - SherenVogue", 
                `অর্ডার আইডি: ${orderId}\nডোমেইন: sherenvogue.com\nপ্রোডাক্টসমূহ: ${productDetails}\nসর্বমোট মূল্য: ৳${currentOrder.total}\nঅর্ডারের সময়: ${currentOrder.date}`
            );

            // কার্ট রিসেট
            cart = [];
            updateCartUI();
            updateOrderUI();
            
            alert(`ধন্যবাদ! আপনার অর্ডারটি সফল হয়েছে। অর্ডার আইডি: ${orderId}`);
        }

        // ৪. অর্ডার বাতিল করার অপশন ও ইমেইল নোটিফিকেশন
        function cancelOrder(orderId) {
            const orderToCancel = orders.find(o => o.id === orderId);
            if (!orderToCancel) return;

            if (confirm("আপনি কি নিশ্চিত যে SherenVogue-এর এই অর্ডারটি বাতিল করতে চান?")) {
                orders = orders.filter(o => o.id !== orderId);
                
                // ক্যানসেল মেইল নোটিফিকেশন
                sendEmailNotification(
                    "অর্ডার বাতিল করা হয়েছে! ❌ - SherenVogue", 
                    `অর্ডার আইডি: ${orderId} কাস্টমার দ্বারা ক্যানসেল করা হয়েছে।\nডোমেইন: sherenvogue.com\nবাতিলকৃত অর্ডারের মোট মূল্য ছিল: ৳${orderToCancel.total}`
                );

                updateOrderUI();
                alert(`অর্ডার ${orderId} সফলভাবে বাতিল করা হয়েছে।`);
            }
        }

        // অর্ডার লিস্ট ফ্রন্টএন্ড UI আপডেট
        function updateOrderUI() {
            const orderStatusList = document.getElementById('orderStatusList');
            document.getElementById('orderCount').innerText = orders.length;

            if (orders.length === 0) {
                orderStatusList.innerHTML = `<p class="text-gray-400 text-center py-4">এখনো কোনো সক্রিয় অর্ডার নেই</p>`;
                return;
            }

            orderStatusList.innerHTML = "";
            orders.forEach(order => {
                let itemsHtml = order.items.map(item => `<li>• ${item.name} <span class="font-bold text-slate-700">(${item.quantity}টি)</span></li>`).join('');
                
                orderStatusList.innerHTML += `
                    <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-200 text-sm space-y-3 shadow-sm">
                        <div class="flex justify-between items-center font-bold text-slate-800">
                            <span>আইডি: <span class="text-amber-600">${order.id}</span></span>
                            <span class="bg-emerald-200 text-emerald-800 text-xs px-2 py-0.5 rounded-full">কনফার্মড</span>
                        </div>
                        <ul class="text-slate-600 text-xs space-y-1 bg-white p-2 rounded-lg border border-emerald-100">
                            ${itemsHtml}
                        </ul>
                        <div class="flex justify-between items-center pt-2 border-t border-emerald-200">
                            <span class="font-bold text-slate-800">মোট: ৳${order.total}</span>
                            <button onclick="cancelOrder('${order.id}')" class="bg-rose-500 hover:bg-rose-600 text-white px-3 py-1.5 rounded-md text-xs font-bold transition shadow-sm">
                                অর্ডার বাতিল করুন
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // ৫. EmailJS Integration
        function sendEmailNotification(subject, message) {
            const templateParams = {
                to_name: "SherenVogue Admin",
                subject: subject,
                message: message
            };

            console.log("Email Notification Payload:", templateParams);

            // EmailJS এর মাধ্যমে লাইভ মেইল যাবে (ক্রেডেনশিয়ালস সেট করার পর)
            emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', templateParams)
                .then(function(response) {
                   console.log('ইমেইল সফলভাবে পাঠানো হয়েছে!', response.status, response.text);
                }, function(error) {
                   console.log('ইমেইল ডেলিভারি ব্যর্থ হয়েছে...', error);
                });
        }

        // স্মুথ স্ক্রলিং এফেক্ট
        function scrollToSection(id) {
            document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
        }

        // ইনিশিয়াল লোড
        window.onload = () => {
            displayProducts(products);
        };
    </script>
</body>
</html>
