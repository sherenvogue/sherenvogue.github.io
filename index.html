<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHERENVOGUE | Haute Couture</title>
    
    <!-- ফন্ট দ্রুত লোড হওয়ার জন্য Preconnect ব্যবহার করা হয়েছে -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* বেসিক রিসেট */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: #050505; 
            overflow: hidden;
        }

        /* সিনেমাটিক ভিডিও ব্যাকগ্রাউন্ড */
        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -2;
            background-color: #000; /* ভিডিও লোড হওয়ার আগে কালো দেখাবে */
        }

        .video-container video {
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: contrast(1.15) brightness(0.85); /* লাক্সারি সিনেমাটিক টোন */
        }

        /* ডার্ক ওভারলে (টেক্সট ফোকাস করার জন্য) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 100%);
            z-index: -1;
        }

        /* মেইন কন্টেন্ট এলাইনমেন্ট */
        .content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            color: #fff;
            z-index: 1;
            animation: fadeIn 2s ease-in-out;
        }

        /* SherenVogue ব্র্যান্ড টাইপোগ্রাফি */
        h1.brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 4.5rem;
            letter-spacing: 0.15em;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            font-weight: 400;
            text-shadow: 2px 4px 15px rgba(0,0,0,0.8);
        }

        h1.brand-name span {
            font-style: italic;
            color: #D4AF37; /* লাক্সারি গোল্ডেন/বাটার কালার */
        }

        h2.subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 0.5em;
            color: #C0C0C0;
            margin-bottom: 4rem;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* লাক্সারি বাটার কালার অ্যানিমেটেড বাটন */
        .shop-btn {
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.25em;
            color: #111;
            /* বাটার/গোল্ড গ্রেডিয়েন্ট অ্যানিমেশনের জন্য */
            background: linear-gradient(60deg, #C5A059, #F3E5AB, #C5A059, #D4AF37);
            background-size: 300% 300%;
            padding: 16px 45px;
            border: 1px solid #F3E5AB;
            border-radius: 2px;
            transition: all 0.4s ease;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.25);
            text-transform: uppercase;
            font-weight: 600;
            animation: goldShimmer 3.5s ease infinite;
            cursor: pointer;
        }

        .shop-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 35px rgba(212, 175, 55, 0.6);
            border-color: #FFF;
            color: #000;
        }

        /* অ্যানিমেশন কি-ফ্রেমস */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes goldShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* মোবাইল রেসপন্সিভ ডিজাইন */
        @media (max-width: 768px) {
            h1.brand-name {
                font-size: 2.8rem;
                letter-spacing: 0.1em;
            }
            h2.subtitle {
                font-size: 0.75rem;
                letter-spacing: 0.3em;
                margin-bottom: 3.5rem;
            }
            .shop-btn {
                padding: 15px 35px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- ব্যাকগ্রাউন্ড ভিডিও সেকশন -->
    <div class="video-container">
        <!-- 
          Fast Loading Tips:
          ১. poster="bg-image.jpg" ব্যবহার করা হয়েছে। এর ফলে ভিডিও লোড হওয়ার আগেই একটি ছবি দেখাবে, স্ক্রিন কালো থাকবে না। 
          ২. ভিডিওটি আপনার লোকাল ফোল্ডারে 'luxury-video.mp4' নামে সেভ করে রাখুন।
        -->
        <video autoplay loop muted playsinline poster="1000069869.jpg">
            <!-- ভিডিওর সোর্স (এখানে আপনার লোকাল ফোল্ডারের ভিডিওর নাম দিন) -->
            <source src="luxury-video.mp4" type="video/mp4">
        </video>
    </div>
    
    <!-- ডার্ক ওভারলে -->
    <div class="overlay"></div>

    <!-- মেইন কন্টেন্ট -->
    <div class="content">
        <h1 class="brand-name">SHEREN<span>VOGUE</span></h1>
        <h2 class="subtitle">Haute Couture</h2>
        
        <!-- শপ ফাইলের লিংক -->
        <a href="shop.html" class="shop-btn">Enter Store</a>
    </div>

</body>
</html>
