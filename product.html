<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="logo1.png">
  <title>Product Details | SherenVogue (শিরিনভোগ)</title>

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-display { font-family: 'Cinzel', serif; }
  </style>
</head>

<body class="bg-stone-50 text-neutral-900 min-h-screen flex flex-col antialiased">

  <!-- Luxury Toast Notification -->
  <div id="luxury-toast" class="fixed bottom-6 right-6 z-[200] transform translate-y-20 opacity-0 transition-all duration-500 bg-neutral-900 text-white px-5 py-4 rounded-2xl shadow-2xl border border-amber-500/30 flex items-center gap-3 pointer-events-none max-w-sm">
    <div class="w-8 h-8 rounded-full bg-amber-600/20 flex items-center justify-center text-amber-400 shrink-0">
      <i data-lucide="check" class="w-4 h-4"></i>
    </div>
    <div>
      <p class="text-[9px] uppercase tracking-widest text-amber-400 font-bold">Maison Atelier</p>
      <p id="toast-message" class="text-xs font-medium text-stone-200"></p>
    </div>
  </div>

  <!-- Top Announcement Bar -->
  <div class="bg-neutral-900 text-amber-200 text-[9px] uppercase tracking-[0.35em] py-2.5 text-center font-medium px-4">
    Complimentary Worldwide Shipping on Orders Over ৳5000 | Support: hello@sherenvogue.com
  </div>

  <!-- Navigation Header -->
  <nav class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-gray-100 px-4 md:px-12 py-3.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="shop.html" class="flex items-center gap-2 text-neutral-700 hover:text-amber-600 transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span class="text-[10px] md:text-xs uppercase tracking-widest font-bold">Back to Store</span>
      </a>

      <a href="index.html" class="flex items-center gap-2">
        <img src="logo1.png" alt="SherenVogue Logo" class="w-7 h-7 md:w-8 md:h-8 object-contain rounded-full border border-amber-500/20" onerror="this.style.display='none'">
        <span class="font-display text-base md:text-xl font-bold tracking-tight text-neutral-900">
          SHEREN<span class="italic font-light text-amber-600">Vogue</span>
        </span>
      </a>

      <a href="shop.html" class="relative p-1 text-gray-700 hover:text-amber-600 transition-colors" title="View Bag in Store">
        <i data-lucide="shopping-bag" class="w-5 h-5 stroke-[1.5]"></i>
        <span id="cart-count" class="absolute -top-1 -right-1 bg-amber-600 text-white text-[8px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
      </a>
    </div>
  </nav>

  <!-- Main Product Details Content -->
  <main class="flex-grow max-w-6xl mx-auto px-4 md:px-8 py-8 md:py-12 w-full">
    
    <!-- Single Product Container -->
    <div id="product-detail-box" class="bg-white rounded-3xl border border-gray-100 p-5 md:p-10 shadow-sm mb-14">
      <p class="text-center text-gray-400 text-xs py-16 uppercase tracking-widest">Loading Masterpiece Details...</p>
    </div>

    <!-- More Products Section (Scroll Down) -->
    <section class="border-t border-gray-200/70 pt-10">
      <div class="flex justify-between items-center mb-6">
        <div>
          <p class="text-[9px] uppercase tracking-[0.3em] text-amber-600 font-bold mb-1">Curated For You</p>
          <h2 class="font-display text-xl md:text-2xl font-bold text-neutral-900">More From The Maison</h2>
        </div>
        <a href="shop.html" class="text-[10px] uppercase tracking-widest font-bold text-amber-600 border-b border-amber-600 pb-0.5">View All</a>
      </div>

      <div id="related-products" class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-5">
        <!-- Other products will load here -->
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="bg-neutral-900 text-white py-8 text-center mt-12">
    <p class="text-[9px] tracking-[0.25em] text-neutral-500 uppercase font-bold px-4">
      &copy; 2026 SHERENVOGUE (শিরিনভোগ). ALL RIGHTS RESERVED. SUPPORT: HELLO@SHERENVOGUE.COM
    </p>
  </footer>

  <script>
    let products = [];
    let cart = JSON.parse(localStorage.getItem('sheren_cart') || '[]');
    let quantity = 1;

    function updateCartBadge() {
      const totalQty = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
      const badge = document.getElementById('cart-count');
      if (badge) badge.innerText = totalQty;
    }

    function showLuxuryToast(message) {
      const toast = document.getElementById('luxury-toast');
      const msg = document.getElementById('toast-message');
      if (!toast || !msg) return;

      msg.innerText = message;
      toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
      }, 3000);
    }

    function changeQty(delta) {
      quantity = Math.max(1, quantity + delta);
      const qtyEl = document.getElementById('qty-value');
      if (qtyEl) qtyEl.innerText = quantity;
    }

    function addCurrentProductToCart(productId, redirectAfter = false) {
      const p = products.find(item => item.id == productId);
      if (!p) return;

      const existing = cart.find(item => item.id == productId);
      if (existing) {
        existing.qty += quantity;
      } else {
        cart.push({ ...p, qty: quantity });
      }

      localStorage.setItem('sheren_cart', JSON.stringify(cart));
      updateCartBadge();

      if (redirectAfter) {
        window.location.href = 'shop.html';
      } else {
        showLuxuryToast(`"${p.name}" (x${quantity}) added to your bag.`);
      }
    }

    async function loadProductPage() {
      updateCartBadge();

      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');

      try {
        const response = await fetch('products.json');
        if (!response.ok) throw new Error('products.json not found');
        products = await response.json();

        const product = products.find(p => p.id == productId) || products[0];
        const detailBox = document.getElementById('product-detail-box');

        if (!product) {
          detailBox.innerHTML = `<p class="text-center text-red-500 py-10 text-sm">Product not found!</p>`;
          return;
        }

        document.title = `${product.name} | SherenVogue`;

        // Render Main Product Details
        detailBox.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12 items-center">
            <!-- Product Image -->
            <div class="w-full aspect-square rounded-2xl overflow-hidden bg-stone-100 border border-gray-100">
              <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover object-center">
            </div>

            <!-- Product Info & Story -->
            <div class="flex flex-col justify-between">
              <div>
                <span class="inline-block bg-amber-50 text-amber-700 text-[9px] uppercase tracking-[0.25em] font-bold px-3 py-1 rounded-full mb-3">
                  ${product.category || 'Haute Couture'}
                </span>
                <h1 class="font-display text-2xl md:text-4xl font-bold text-neutral-900 leading-snug mb-3">
                  ${product.name}
                </h1>
                <p class="text-2xl md:text-3xl font-bold text-amber-600 mb-5">${product.price}</p>

                <div class="border-t border-b border-gray-100 py-4 my-4">
                  <p class="text-[10px] uppercase tracking-widest font-bold text-neutral-900 mb-2">Craftsmanship &amp; Story</p>
                  <p class="text-gray-500 text-xs md:text-sm leading-relaxed">
                    ${product.desc || 'Masterfully handcrafted in the SherenVogue atelier using bespoke materials and timeless haute couture techniques.'}
                  </p>
                </div>

                <!-- Quantity Selector -->
                <div class="flex items-center gap-4 my-6">
                  <span class="text-[10px] uppercase tracking-widest font-bold text-gray-500">Quantity:</span>
                  <div class="flex items-center border border-gray-200 rounded-xl overflow-hidden">
                    <button type="button" onclick="changeQty(-1)" class="px-3.5 py-2 text-sm font-bold text-neutral-700 hover:bg-stone-100">-</button>
                    <span id="qty-value" class="px-4 py-2 text-xs font-bold text-neutral-900">1</span>
                    <button type="button" onclick="changeQty(1)" class="px-3.5 py-2 text-sm font-bold text-neutral-700 hover:bg-stone-100">+</button>
                  </div>
                </div>
              </div>

              <!-- Action Buttons -->
              <div class="flex flex-col sm:flex-row gap-3 mt-2">
                <button type="button" onclick="addCurrentProductToCart(${product.id}, false)" class="flex-1 bg-neutral-900 text-white py-4 px-6 rounded-xl text-[10px] md:text-xs uppercase tracking-widest font-bold hover:bg-amber-600 transition-all shadow-sm">
                  Add To Atelier Bag
                </button>
                <button type="button" onclick="addCurrentProductToCart(${product.id}, true)" class="flex-1 border border-neutral-900 text-neutral-900 py-4 px-6 rounded-xl text-[10px] md:text-xs uppercase tracking-widest font-bold hover:bg-neutral-900 hover:text-white transition-all">
                  Go To Store &amp; Checkout
                </button>
              </div>
            </div>
          </div>
        `;

        // Render Other Products Below
        const relatedContainer = document.getElementById('related-products');
        const otherProducts = products.filter(p => p.id != product.id);

        if (otherProducts.length === 0) {
          relatedContainer.innerHTML = `<p class="col-span-full text-gray-400 text-xs">More exclusive pieces coming soon.</p>`;
        } else {
          relatedContainer.innerHTML = otherProducts.map(rp => `
            <a href="product.html?id=${rp.id}" class="bg-white rounded-2xl border border-gray-100 p-3 shadow-sm group flex flex-col justify-between hover:border-amber-400/50 transition-all">
              <div>
                <div class="w-full h-44 rounded-xl overflow-hidden bg-stone-100 mb-3">
                  <img src="${rp.image}" alt="${rp.name}" class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-500">
                </div>
                <p class="text-[8px] uppercase tracking-[0.2em] text-amber-600 font-bold mb-0.5">${rp.category || 'Luxury'}</p>
                <h3 class="font-display text-xs font-bold text-neutral-900 truncate group-hover:text-amber-600 transition-colors">${rp.name}</h3>
                <p class="text-xs font-bold text-gray-800 mt-1">${rp.price}</p>
              </div>
            </a>
          `).join('');
        }

      } catch (error) {
        console.error('Error:', error);
        document.getElementById('product-detail-box').innerHTML = `<p class="text-center text-red-500 py-10 text-xs">Failed to load product details. Please check products.json.</p>`;
      }

      if (window.lucide) lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', loadProductPage);
  </script>
</body>
</html>
