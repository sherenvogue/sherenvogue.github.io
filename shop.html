<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SherenVogue | International Luxury Brand</title>
    <!-- Google Fonts for Luxury Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Montserrat', sans-serif; background-color: #0c0c0c; color: #fff; }
        
        /* ব্যাকগ্রাউন্ড ইমেজ ও স্লো জুম অ্যানিমেশন (Ken Burns Effect) */
        .hero-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.75)), url('image_8.png') no-repeat center center/cover;
            animation: zoomEffect 20s infinite alternate;
            z-index: 1;
        }
        @keyframes zoomEffect {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        /* সেন্ট্রাল কন্টেন্ট কন্টেইনার */
        .hero-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            padding: 20px;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #d4af37;
            margin-bottom: 15px;
            opacity: 0;
            animation: fadeInDown 1.2s ease forwards;
        }

        .brand-title {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeInUp 1.2s ease 0.3s forwards;
        }

        .brand-desc {
            font-size: 1.05rem;
            max-width: 650px;
            color: #d0d0d0;
            margin-bottom: 40px;
            line-height: 1.8;
            opacity: 0;
            animation: fadeInUp 1.2s ease 0.6s forwards;
        }

        /* মাঝখানের লাক্সারি শপিং বাটন */
        .shop-btn {
            display: inline-block;
            padding: 18px 45px;
            background-color: transparent;
            color: #d4af37;
            border: 2px solid #d4af37;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.4s ease;
            opacity: 0;
            animation: fadeInUp 1.2s ease 0.9s forwards;
            position: relative;
            overflow: hidden;
            border-radius: 2px;
        }

        .shop-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background-color: #d4af37;
            transition: all 0.4s ease;
            z-index: -1;
        }

        .shop-btn:hover {
            color: #000;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.6);
        }

        .shop-btn:hover::before {
            left: 0;
        }

        /* স্মুথ এন্ট্রান্স অ্যানিমেশন */
        @keyframes fadeInDown {
            to { opacity: 1; transform: translateY(0); }
            from { opacity: 0; transform: translateY(-20px); }
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
            from { opacity: 0; transform: translateY(20px); }
        }

        /* মোবাইল ও পিসি রেসপন্সিভ ডিজাইন */
        @media(max-width: 768px) {
            .brand-title { font-size: 2.5rem; letter-spacing: 3px; }
            .brand-desc { font-size: 0.95rem; padding: 0 15px; }
            .shop-btn { padding: 15px 35px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <!-- ব্যাকগ্রাউন্ড ইমেজ অ্যানিমেশন -->
    <div class="hero-bg"></div>

    <!-- ফ্রন্ট লাক্সারি কন্টেন্ট -->
    <div class="hero-content">
        <span class="brand-subtitle">Haute Couture & Luxury Living</span>
        <h1 class="brand-title">SherenVogue</h1>
        <p class="brand-desc">মোগল রাজকীয় ঐতিহ্য এবং আধুনিক আন্তর্জাতিক আভিজাত্যের নিখুঁত সংমিশ্রণে তৈরি সীমিত সংস্করণের এক্সক্লুসিভ মাস্টারপিস।</p>
        
        <!-- শপিং বাটন যা মূল শপ পেজে নিয়ে যাবে -->
        <a href="shop.html" class="shop-btn">Explore Collection</a>
    </div>

</body>
</html>
