<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | SherenVogue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { background-color: #1A1A1A; font-family: 'Inter', sans-serif; color: white; }
        .font-display { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar/Header -->
    <header class="py-5 px-6 border-b border-[#C5A059]/20 flex justify-between items-center bg-black/50 sticky top-0 z-50 backdrop-blur-md">
        <a href="shop.html" class="flex items-center gap-2 text-[#C5A059] hover:text-white transition">
            <i data-lucide="arrow-left" class="w-5 h-5"></i> <span class="text-sm uppercase tracking-widest">Back to Shop</span>
        </a>
        <h1 class="font-display text-xl text-[#C5A059] tracking-widest uppercase">SherenVogue</h1>
    </header>

    <!-- Product Details Section -->
    <main class="flex-grow max-w-6xl mx-auto px-6 py-12 w-full">
        <div id="product-container" class="grid grid-cols-1 md:grid-cols-2 gap-12 mb-20">
            <!-- Product details will load here via JavaScript -->
        </div>

        <!-- Related Products Section -->
        <div class="border-t border-gray-800 pt-12">
            <h2 class="font-display text-2xl text-[#C5A059] mb-8 uppercase tracking-widest text-center">Discover More</h2>
            <div id="related-products" class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-8">
                <!-- Related products will load here -->
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        // ১. প্রোডাক্ট ডাটাবেস (Real Products)
        let products = [
            { id: 1, name: "The Sheren Burgundy Edition (Heritage Regalia Structured Bag)", category: "bags", price: "৳10,500", rawPrice: 10500, image: "100001.jpg", desc: "A crown jewel of the SherenVogue haute couture collection. Masterfully handcrafted from rich burgundy artisan leather, accented with signature winged gold hardware, a twisted gold handle, and a sophisticated chain strap." },
            { id: 2, name: "SherenVogue Royal Timepiece", category: "watches", price: "৳7,990", rawPrice: 7990, image: "100002.jpg", desc: "High-complication horology designed for timeless elegance with Roman numerals and rose-gold finish." },
            { id: 3, name: "Sheren Vento Solare Collection Set", category: "accessories", price: "৳1,990", rawPrice: 1990, image: "100003.jpg", desc: "Exclusive Vento Solare collection featuring a luxury timepiece, gold-accented fountain pen, and premium leather wallet." }
        ];

        // URL থেকে প্রোডাক্ট আইডি নেওয়া
        const urlParams = new URLSearchParams(window.location.search);
        const productId = parseInt(urlParams.get('id'));

        // প্রোডাক্ট খুঁজে বের করা
        const product = products.find(p => p.id === productId);

        if (product) {
            // প্রোডাক্টের বিস্তারিত দেখানো
            document.getElementById('product-container').innerHTML = `
                <div class="flex justify-center items-center bg-[#0a0a0a] rounded-lg p-4">
                    <img src="${product.image}" alt="${product.name}" class="max-w-full h-auto max-h-[500px] object-contain drop-shadow-2xl">
                </div>
                <div class="flex flex-col justify-center">
                    <p class="text-[#C5A059] text-xs uppercase tracking-widest mb-3">${product.category}</p>
                    <h1 class="font-display text-3xl md:text-4xl mb-4 leading-tight">${product.name}</h1>
                    <p class="text-2xl text-gray-300 font-light mb-6">${product.price}</p>
                    <p class="text-gray-400 text-sm md:text-base leading-relaxed mb-10">${product.desc}</p>
                    
                    <button onclick="alert('Item added to bag!')" class="bg-[#C5A059] text-black w-full py-4 text-sm uppercase tracking-widest font-bold hover:bg-white hover:text-black transition-all">
                        Add to Bag - ${product.price}
                    </button>
                </div>
            `;

            // অন্য প্রোডাক্টগুলো (Related Products) দেখানো
            const relatedProducts = products.filter(p => p.id !== productId);
            const relatedContainer = document.getElementById('related-products');
            
            relatedProducts.forEach(rp => {
                relatedContainer.innerHTML += `
                    <a href="product.html?id=${rp.id}" class="group block bg-[#0a0a0a] p-4 rounded-lg hover:border-[#C5A059] border border-transparent transition-all">
                        <img src="${rp.image}" alt="${rp.name}" class="w-full h-40 object-cover mb-4">
                        <h3 class="font-display text-sm truncate mb-2">${rp.name}</h3>
                        <p class="text-[#C5A059] text-sm">${rp.price}</p>
                    </a>
                `;
            });
        } else {
            // ভুল আইডিতে গেলে মেসেজ
            document.getElementById('product-container').innerHTML = `<h1 class="text-white text-2xl">Product not found!</h1>`;
        }
    </script>
</body>
</html>
